name: refresh snapshot

# Re-scrape the cve-announce list and regenerate data/ on a schedule, committing
# the snapshot only when the numbers actually change. The collection window
# extends to the current month automatically (see bin/collect-cves).

on:
  schedule:
    - cron: '17 6 * * 1'   # every Monday, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: '5.40'
          install-modules-with: cpanm

      - name: Install dependencies
        run: cpanm --notest --installdeps .

      - name: Regenerate snapshot
        run: |
          perl bin/collect-cves
          perl bin/rank-cwes
          perl bin/build-report

      - name: Commit if changed
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/
          if git diff --cached --quiet; then
            echo 'No changes.'
          else
            git commit -m "Refresh CWE snapshot ($(date -u +%Y-%m-%d))"
            git push
          fi
